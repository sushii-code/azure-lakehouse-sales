name: azure_lakehouse_sales
version: "1.0.0"
config-version: 2

# Which connection in ~/.dbt/profiles.yml to use
profile: azure_lakehouse_sales

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

# Folders removed by `dbt clean`
clean-targets: ["target", "dbt_packages"]

models:
  azure_lakehouse_sales:
    # Staging: light renaming of silver tables, kept as views in workspace.staging
    staging:
      +materialized: view
      +schema: staging
    # Marts: business-ready star schema, stored as tables in workspace.gold
    marts:
      +materialized: table
      +schema: gold
